{% extends 'catalog/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
            {% else %}
                <img src="{% static 'img/default_photo.png' %}" class="img-fluid" alt="Изображение товара отсутствует">
            {% endif %}
        </div>
        <div class="col-md-6">
            <h1>{{ product.name }}</h1>
            <p class="text-muted">{{ product.category.name }}</p>
            <h3 class="text-success">{{ product.price }} $</h3>
            <p>{{ product.description }}</p>
            <p class="text-secondary">Создан: {{ product.created_at|date:"d M Y" }}</p>
            <a href="#" class="btn btn-primary">Купить</a>
            <a class="btn btn-outline-secondary" href="/">← Назад</a>
        </div>
    </div>
</div>
{% endblock %}
