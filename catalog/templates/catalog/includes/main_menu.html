<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 font-weight-normal">Skystore</h5>
    <nav class="ms-5 d-flex align-items-center gap-2">
        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:catalog_contacts' %}">Контакты</a>
    </nav>

    <div class="ms-auto">
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger p-2">Выйти</button>
            </form>
        {% else %}
            <a class="btn btn-outline-success p-2" href="{% url 'login' %}">Войти</a>
        {% endif %}
    </div>
</div>
