{% extends "blog/base.html" %}
{% load static %}
{% block content %}
<div class="container mt-4">
    <h1>{{ blog.title }}</h1>
    <p class="text-muted">Создано {{ blog.date_created|date:"d.m.Y H:i" }} | Просмотров: {{ blog.view_count }}</p>

    <div class="col-md-4 mb-5 justify-content-center mx-auto">
    {% if blog.preview %}
        <img src="{{ blog.preview.url }}" class="img-fluid mb-3" alt="{{ blog.title }}">
    {% else %}
        <img src="{% static 'img/default_photo.png' %}" class="card-img-top" alt="Нет изображения">
    {% endif %}
    </div>

    <p>{{ blog.content }}</p>

    <hr>
    <div class="container d-flex justify-content-between">
        <div>
            <a href="{% url 'blog:blog_edit' blog.pk %}" class="btn btn-primary">Редактировать</a>
            <a href="{% url 'blog:blog_delete' blog.pk %}" class="btn btn-danger">Удалить</a>
        </div>
        <div>
            <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Назад ко всем статьям</a>
        </div>
    </div>
</div>
{% endblock %}
