{% extends "blog/base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Удалить статью</h2>
    <p>Ты уверена, что хочешь удалить статью <strong>«{{ blog.title }}»</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">❌ Удалить</button>
        <a href="{% url 'blog:blog_detail' blog.pk %}" class="btn btn-secondary ms-2">↩ Отмена</a>
    </form>
</div>
{% endblock %}
