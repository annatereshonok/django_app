{% extends "blog/base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>{% if blog.pk %}Редактировать статью{% else %}Создать новую статью{% endif %}</h1>
    <form method="post" enctype="multipart/form-data" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
